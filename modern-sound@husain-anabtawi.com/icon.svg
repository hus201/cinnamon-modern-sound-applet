<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Modern Sound">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a2b2f"/>
      <stop offset="1" stop-color="#1a1b1e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6fa0f0"/>
      <stop offset="1" stop-color="#8ab4f8"/>
    </linearGradient>
  </defs>

  <!-- App tile background -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="25.5" fill="none" stroke="#3a3d44" stroke-width="1"/>

  <!-- Speaker body -->
  <path fill="#e8eaed" d="M34 52h12.5l16.5-10v44L46.5 76H34c-2.2 0-4-1.8-4-4V56c0-2.2 1.8-4 4-4z"/>
  <path fill="#e8eaed" d="M63 48.5c4.8 4.1 7.8 10.2 7.8 15.5s-3 11.4-7.8 15.5c-.9.8-2.3.1-2.3-1V49.5c0-1.1 1.4-1.8 2.3-1z"/>

  <!-- Sound waves -->
  <path fill="none" stroke="#8ab4f8" stroke-width="3.5" stroke-linecap="round" d="M76 54c6.5 4.2 10.5 10.5 10.5 10s-4 5.8-10.5 10"/>
  <path fill="none" stroke="#8ab4f8" stroke-width="3.5" stroke-linecap="round" opacity="0.65" d="M86 47c9.5 6.2 15.5 15.5 15.5 15s-6 8.8-15.5 15"/>

  <!-- Volume slider -->
  <rect x="28" y="88" width="72" height="8" rx="4" fill="#ffffff" opacity="0.14"/>
  <rect x="28" y="88" width="50" height="8" rx="4" fill="url(#accent)"/>
  <circle cx="78" cy="92" r="9" fill="#c8daff"/>
  <circle cx="78" cy="92" r="5.5" fill="#8ab4f8"/>
